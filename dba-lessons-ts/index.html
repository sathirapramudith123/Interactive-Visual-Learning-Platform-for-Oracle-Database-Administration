<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DBA Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="top">
  <div class="brand"><div class="logo">&#9635;</div><div><h1>DBA EXPLORER</h1><p>LEARN HOW ORACLE WORKS</p></div></div>
  <div class="lecs"><span class="cap">LECTURE</span><div id="chips"></div></div>
</header>
<div class="grid">
  <nav class="box side"><h2>IT4040 LESSONS</h2><div id="ls"></div></nav>
  <main class="mid">
    <section class="box scenebox">
      <div class="tabs"><b id="ti"></b><span id="su"></span></div>
      <div id="scene" class="scene" aria-label="3D diagram of the lesson"></div>
    </section>
    <section class="box flow">
      <div class="fbar">
        <h2>EVENT FLOW</h2>
        <div class="ctl">
          <select id="spd" aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="3">3x</option></select>
          <button id="prv" aria-label="Previous step">&lsaquo;</button>
          <button id="play" class="pri">PAUSE</button>
          <button id="rep">REPLAY</button>
          <button id="stp">STEP</button>
          <button id="rst">RESET</button>
        </div>
      </div>
      <div class="twrap" id="twrap">
        <table class="ft"><thead><tr><th>NO.</th><th>TIME</th><th>FROM</th><th>TO</th><th>STEP</th><th>INFO</th></tr></thead><tbody id="tb"></tbody></table>
      </div>
    </section>
  </main>
  <aside class="box sum"><h2>LESSON SUMMARY</h2><div id="pbody"></div></aside>
</div>
<script type="module" src="/src/main.ts"></script>
</body></html>

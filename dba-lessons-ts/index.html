<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DBA Visual Lessons</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
<header><b>DBA Visual Lessons</b><span><button id="labbtn">Lab</button> <button id="th" aria-label="Toggle light and dark theme">Theme</button></span></header>
<div class="app">
<nav class="side"><h3>IT4040 lessons</h3><div id="ls" style="display:contents"></div></nav>
<main class="stage">
<h1 id="ti"></h1><p class="sub" id="su"></p>
<div class="tools"><button id="rp">Replay</button><button id="pl">Play</button></div>
<svg id="sv" viewBox="0 0 680 250" role="img" aria-label="Animated diagram of the lesson"></svg>
<div class="dots" id="dt"></div>
</main>
<aside class="panel">
<div class="step" id="sn"></div><h2 id="sh"></h2><p id="sp"></p>
<div class="key"><b>Key idea</b><br><span id="sk"></span></div>
<div class="nav"><button id="bk">Back</button><button id="nx" class="go">Next</button></div>
<p class="step">Keys: left and right arrows, R to replay</p>
</aside></div>

<section class="lab" id="lab" hidden>
  <div class="dbar"><span><b>Oracle Linux 8</b> &middot; virtual machine</span><span id="lbadge"></span><button id="labclose">Close (Esc)</button></div>
  <div class="desk">
    <div class="win wt">
      <div class="wbar"><i></i><i></i><i></i><span>oracle@dbserver: ~</span></div>
      <div class="chips" id="chips"></div>
      <div class="term" id="term" aria-live="polite"></div>
      <form id="lf"><label>SQL&gt; <input id="cmd" autocomplete="off" spellcheck="false" aria-label="Type a command"></label></form>
    </div>
    <div class="win wd">
      <div class="wbar"><i></i><i></i><i></i><span>Oracle server (live view)</span></div>
      <div class="states" id="lsts"></div>
      <p class="step" id="linfo"></p>
      <svg id="lsv" viewBox="0 0 420 300" role="img" aria-label="Live view of the Oracle server"></svg>
    </div>
  </div>
</section>

<script type="module" src="/src/main.ts"></script>
</body></html>
